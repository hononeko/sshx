name: Release Binary Assets

# Every push to main that warrants a new version releases it: signed, attested binary archives for each platform,
# a vX.Y.Z tag and a GitHub Release with grouped release notes. The version and notes rules are shared by all my
# repositories (hononeko/actions). Dispatch with dry_run to see the next version and its notes without releasing.
on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Show the next version and its release notes without releasing
        type: boolean
        default: false

# Never cancel a release mid-flight: a run cancelled after pushing its tag would
# leave a tag without a release. Superseded runs skip themselves at the tip check.
concurrency:
  group: cd-release
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  plan:
    name: Plan Release
    needs: validate
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version_tag: ${{ steps.version.outputs.version-tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Version
        id: version
        uses: hononeko/actions/version@447f70cc12b6edef1ce53187f14c01c582ed7300 # v1.4.0
        with:
          tag-prefix: v

      - name: Release notes
        uses: hononeko/actions/release-notes@447f70cc12b6edef1ce53187f14c01c582ed7300 # v1.4.0
        with:
          previous-tag: ${{ steps.version.outputs.previous-tag }}
          tag: ${{ steps.version.outputs.version-tag }}
          summary: Release notes for ${{ steps.version.outputs.version-tag }}

      - name: Upload release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-notes
          path: release-notes.md

      # Releases only from main, only from its tip (a newer push releases instead, which avoids out-of-order
      # releases), and only a version not yet tagged.
      - name: Decide whether to release
        id: decide
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          VERSION_TAG: ${{ steps.version.outputs.version-tag }}
          VERSION_TYPE: ${{ steps.version.outputs.version-type }}
        run: |
          release=true
          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::Dry run: not releasing $VERSION_TAG"; release=false
          elif [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::notice::Releases are published from main only"; release=false
          elif [ "$VERSION_TYPE" = "none" ]; then
            release=false
          else
            git fetch -q origin main --tags
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              echo "::warning::$GITHUB_SHA is no longer the tip of main; the newer push releases instead"; release=false
            elif git rev-parse -q --verify "refs/tags/$VERSION_TAG" >/dev/null; then
              echo "::warning::$VERSION_TAG already exists; not releasing it again"; release=false
            fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

  release:
    name: Build & Publish Release
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-26.04
    # SSHX_SIGNING_KEY lives in this environment, which only the main branch can deploy to.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION_TAG: ${{ needs.plan.outputs.version_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Build Multi-Platform Release Archives
        run: |
          VERSION="$VERSION_TAG"
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          LDFLAGS="-s -w -X main.Version=${VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}"

          mkdir -p dist

          PLATFORMS=(
            "linux/amd64/sshx"
            "linux/arm64/sshx"
            "darwin/amd64/sshx"
            "darwin/arm64/sshx"
            "windows/amd64/sshx.exe"
          )

          for p in "${PLATFORMS[@]}"; do
            IFS="/" read -r OS ARCH BINARY <<< "$p"
            STAGE_DIR="dist/sshx_${VERSION}_${OS}_${ARCH}"
            mkdir -p "$STAGE_DIR"

            echo "==> Building ${OS}/${ARCH}..."
            GOOS=$OS GOARCH=$ARCH CGO_ENABLED=0 go build -trimpath -ldflags="$LDFLAGS" -o "$STAGE_DIR/$BINARY" .
            cp README.md LICENSE "$STAGE_DIR/"

            cd dist
            if [ "$OS" = "windows" ]; then
              zip -r "sshx_${VERSION}_${OS}_${ARCH}.zip" "sshx_${VERSION}_${OS}_${ARCH}"
              cp "sshx_${VERSION}_${OS}_${ARCH}.zip" "sshx_${OS}_${ARCH}.zip"
            else
              tar -czf "sshx_${VERSION}_${OS}_${ARCH}.tar.gz" "sshx_${VERSION}_${OS}_${ARCH}"
              cp "sshx_${VERSION}_${OS}_${ARCH}.tar.gz" "sshx_${OS}_${ARCH}.tar.gz"
            fi
            rm -rf "sshx_${VERSION}_${OS}_${ARCH}"
            cd ..
          done

          cd dist
          sha256sum * > checksums.txt
          cd ..

      - name: Sign Checksums
        env:
          SSHX_SIGNING_KEY: ${{ secrets.SSHX_SIGNING_KEY }}
        run: |
          if [ -z "$SSHX_SIGNING_KEY" ]; then
            echo "::error::SSHX_SIGNING_KEY is not configured; refusing to publish an unsigned release."
            exit 1
          fi

          umask 077
          WORK_DIR="$(mktemp -d)"
          trap 'rm -rf "$WORK_DIR"' EXIT
          printf '%s\n' "$SSHX_SIGNING_KEY" > "$WORK_DIR/key.pem"

          # Installed binaries only accept keys listed in TrustedKeys, so a key
          # missing from that list would publish a release nobody could update to.
          PUBLIC_KEY="$(openssl pkey -in "$WORK_DIR/key.pem" -pubout -outform DER | tail -c 32 | base64 -w0)"
          if ! grep -qF "\"$PUBLIC_KEY\"" internal/update/update.go; then
            echo "::error::The signing key's public key ($PUBLIC_KEY) is not in TrustedKeys in internal/update/update.go."
            exit 1
          fi

          openssl pkeyutl -sign -inkey "$WORK_DIR/key.pem" -rawin -in dist/checksums.txt -out "$WORK_DIR/checksums.sig"
          openssl pkey -in "$WORK_DIR/key.pem" -pubout -out "$WORK_DIR/public.pem"
          openssl pkeyutl -verify -pubin -inkey "$WORK_DIR/public.pem" -rawin -in dist/checksums.txt -sigfile "$WORK_DIR/checksums.sig"
          base64 -w0 "$WORK_DIR/checksums.sig" > dist/checksums.txt.sig

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/checksums.txt.sig

      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-notes

      - name: Tag & create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION_TAG" --target "$GITHUB_SHA" --title "$VERSION_TAG" --notes-file release-notes.md dist/*
